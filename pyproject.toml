[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handwash-model"
version = "0.1.0"
description = "HigenAI - reconhecimento dos passos da tecnica OMS de higienizacao das maos via landmarks de mao"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
